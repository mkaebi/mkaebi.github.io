# ============================================================================
# Research papers
# ----------------------------------------------------------------------------
# Rendered by _includes/paper.html on /research/. Every field except `title`
# is optional — anything you leave out is simply not rendered, so a half-filled
# entry still looks finished.
#
#   title          Paper title.
#   id             Anchor slug. Gives each paper a permalink such as
#                  /research/#covariance-implied-risk-factors, which opens the
#                  abstract automatically. Keep it stable once shared.
#   url            Link on the title. Omit for an unlinked (unposted) paper.
#   authors        Co-authors, e.g. "with Igor F. B. Martins". Omit if solo.
#   summary        One-line plain-language takeaway. Shown always.
#   abstract       Full abstract. Shown in a collapsible "Abstract" dropdown.
#                  Use the >- block below so you can paste multiple paragraphs
#                  (blank line between them). If empty, no dropdown appears.
#   image          Figure, relative to /images/. e.g. "papers/vix.png".
#                  Shown at its own aspect ratio, so no crop to plan around.
#                  Aim for about 720px wide; it displays at ~300px.
#                  If empty, a numbered plate is drawn instead — so the page
#                  looks deliberate whether or not you have artwork yet.
#   image_alt      Describe the figure for screen readers and search engines.
#   status         Short state, e.g. "Under review", "R&R at ...".
#   award          text: ...   and optionally   url: ...
#   presentations  List of venues.
#
# Order here is the order on the page.
# ============================================================================

working:
  - title: "VIX Futures Term-Structure and Currency Returns"
    id: vix-futures-term-structure-and-currency-returns
    url: "https://dx.doi.org/10.2139/ssrn.5363287"
    summary: >-
      VIX futures term-structure embed a price of risk in currency markets,
      consistent with an intermediary asset pricing model with volatility-hedging
      demand and arbitrage constraints.
    abstract: >-
      I use the VIX futures term-structure to build novel currency risk factors and 
      show that they are priced in the cross-section of currency returns and carry 
      incremental predictive information for future returns. Currencies with greater 
      exposure to the level and curvature factors earn a lower risk premium, acting 
      as insurance, while those more exposed to the slope factor earn a higher premium. 
      A portfolio that is long high-exposure currencies and short low-exposure currencies 
      captures this risk-return dispersion, and its excess return can be understood as 
      compensation for bearing a globally priced volatility shock. Decomposing the factor 
      returns into news about expected future volatility and news about the variance-risk 
      premium, I find that the risk premia are driven almost entirely by variance-risk-premium 
      news, while expected-volatility news carries no price of risk. A Bayesian factor-selection 
      procedure confirms that the term-structure factors enter the stochastic discount factor with 
      high posterior probability. I rationalize these results with a two-agent preferred-habitat 
      model in which experts have horizon-specific volatility hedging demands and arbitrageurs 
      face funding and margin costs.


    image: "papers/vix-term-structure.png"
    image_alt: "Currencies sorted into quintile portfolios by their exposure to the first three principal components of the VIX futures term structure, 2010-2025"
    award:
      text: "Best Paper Award in Asset Pricing — Brazilian Finance Society, 2026"
      url: "https://sbfin.org.br/pt/evento/xxvi-encontro-brasileiro-de-financas-2026"
    presentations:
      - "Insper Macro & Finance Workshop"
      - "32nd AEFIN Finance Forum (Spanish Finance Association)"
      - "26th Meeting of the Brazilian Finance Society"

  - title: "Long-Run Interest Rate Differentials and the Profitability of Currency Carry"
    id: long-run-interest-rate-differentials
    url: "https://drive.google.com/file/d/1GStiVtJjzZ6uNYpW21snYiN-nvWZc_8u/view?usp=drive_link"
    authors: "with Igor F. B. Martins"
    summary: >-
      Carry trades based on the long-run component of long-maturity yield
      differentials outperform and subsume traditional carry factors in
      explaining currency risk premia.
    abstract: >-
      This paper examines the role of long-run and cyclical components of interest rate differentials in explaining the returns to currency carry strategies. We decompose long-term nominal interest rate differentials into trend and cycle components and show that the resulting signals are largely orthogonal to the traditional short-term carry signal. A simple strategy that goes long currencies above the median long-run differential and shorts those below delivers a statistically and economically significant annualized excess return of 2.97%. Relative to both traditional and static carry, our strategy achieves a higher Sharpe ratio before and after transaction costs, higher Sortino and Omega ratios, less negative skewness and lower excess kurtosis. We introduce a new tradable carry factor that earns a positive and significant risk premium across distinct cross-sections of currency returns and subsumes the pricing information of existing carry benchmarks, while retaining independent variation that neither can explain.
    image: "papers/carry-star.png"
    image_alt: "Cumulative returns 1988-2025 for the long-run carry strategy, which ends near 1.8, against the traditional carry trade and static carry, both near 1.0"
    status: "Under review"

  - title: "Covariance Implied Risk Factors"
    id: covariance-implied-risk-factors
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6136149"
    summary: >-
      Heteroskedasticity distorts latent factor estimation in asset pricing, and
      correcting for it with heteroPCA delivers economically interpretable
      factors and superior cross-sectional pricing performance.
    abstract: >-
      This paper examines the role of heteroskedasticity in extracting latent risk factors from asset returns. I show that standard principal component analysis suffers from distortions when assets exhibit heterogeneous idiosyncratic variances, leading factors to reflect clusters of idiosyncratic risk rather than true systematic risk. Building on recent developments in the statistics literature, I apply heteroskedastic PCA (heteroPCA) to correct for this bias by iteratively replacing the diagonal of the sample covariance matrix with estimates implied by the off-diagonal structure. The correction is purely statistical: it requires no characteristics, instruments, or auxiliary data beyond the return panel itself. This approach delivers superior out-of-sample cross-sectional pricing performance compared to standard PCA, with higher Sharpe ratios and lower average pricing errors across multiple equity and FX portfolios. The identified factors exhibit clear economic interpretability, and the implied stochastic discount factor achieves lower Hansen-Jagannathan distances. These results highlight that accounting for heteroskedasticity in idiosyncratic variance substantially improves factor estimation in asset pricing applications, across asset classes and at no additional data cost.

    image: "papers/heteropca.png"
    image_alt: "Stochastic discount factor weights on accrual-by-size portfolios under standard PCA versus heteroPCA"
    presentations:
      - "Insper Macro & Finance Workshop"
      - "FinanceHub 2026"
      - "33rd AEFIN Finance Forum (Spanish Finance Association)"
      - "26th Meeting of the Brazilian Finance Society"
      - "10th Vietnam International Conference in Finance (accepted, VICIF 2026)"

  - title: "Firm Characteristics and Stock Returns in Brazil"
    id: firm-characteristics-and-stock-returns-in-brazil
    url: "https://dx.doi.org/10.2139/ssrn.4801117"
    authors: "with Ruy M. Ribeiro, Josué P. A. Costa, Tomas Nóbrega and Igor F. B. Martins"
    summary: >-
      Price-related characteristics, rather than accounting fundamentals, drive
      return predictability and portfolio performance in the Brazilian equity
      market.
    abstract: >-
      We investigate the impact of firm characteristics on stock returns in the Brazilian financial market, considering a long list of characteristics found be relevant in the U.S. market. Employing Fama-MacBeth regressions, alongside machine learning techniques, we examine over 24 firm-level characteristics. Our findings highlight the stronger influence of price-related metrics, such as past return, liquidity, size and volatility, over accounting variables. We also explore the robustness of these characteristics through the construction of various portfolios, revealing significant alphas in multiple portfolio construction methods and substantial out-of-sample performance.
    image:
    image_alt:
    presentations:
      - "24th Meeting of the Brazilian Finance Society"
      - "LatAm EQDerivatives (2024)"
      - "Insper Macro & Finance Workshop"

