# ============================================================================
# Research papers
# ----------------------------------------------------------------------------
# Rendered by _includes/paper.html on /research/ (and the featured ones on the
# home page). Every field except `title` is optional — anything you leave out
# is simply not rendered, so a half-filled entry still looks finished.
#
#   title          Paper title.
#   id             Anchor slug. Gives each paper a permalink such as
#                  /research/#covariance-implied-risk-factors, which opens the
#                  abstract automatically. Keep it stable once shared.
#   url            Link on the title. Omit for an unlinked (unposted) paper.
#   authors        Co-authors, e.g. "with Igor F. B. Martins". Omit if solo.
#   summary        One-line plain-language takeaway. Shown always.
#   abstract       Full abstract. Shown in a collapsible "Abstract" dropdown.
#                  Use the >- block below so you can paste multiple paragraphs
#                  (blank line between them). If empty, no dropdown appears.
#   image          Thumbnail, relative to /images/. e.g. "papers/vix.png".
#                  If empty, a numbered plate is drawn instead — so the page
#                  looks deliberate whether or not you have artwork yet.
#                  Best results: a roughly 4:3 crop, at least 480x360.
#   image_alt      Describe the figure for screen readers and search engines.
#   status         Short state, e.g. "Under review", "R&R at ...".
#   award          text: ...   and optionally   url: ...
#   presentations  List of venues.
#   featured       true to also surface it on the home page.
# ============================================================================

